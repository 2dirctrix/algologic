upstream backend_api {
        server i13c204.p.ssafy.io:8081;
}

server {
        listen                          80;
        server_name                     i13c204.p.ssafy.io;

        location / {
                return 301 https://$host$request_uri;
        }

        error_log                       /var/log/nginx/error.log;
        access_log                      /var/log/nginx/access.log;
}

server {
        listen                          443 ssl;
        server_name                     i13c204.p.ssafy.io;
 
        ssl_certificate /etc/letsencrypt/live/i13c204.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i13c204.p.ssafy.io/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
 
        location / {
                root                    /usr/share/nginx/html;
                index                   index.html;

                try_files $uri $uri/    /index.html;
        }
        
        location /ws {
                proxy_pass              http://backend_api;

                proxy_http_version      1.1;
                proxy_set_header        Host $host;
                proxy_set_header        Upgrade $http_upgrade;
                proxy_set_header        Connection "Upgrade";
        }

        location /api {
                proxy_pass              http://backend_api;

                proxy_set_header        Host $host;
                proxy_set_header        X-Real-IP $remote_addr;
                proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header        X-Forwarded-Proto $scheme;
                proxy_set_header        Upgrade $http_upgrade;
                proxy_set_header        Connection "upgrade";
 
                add_header              'Access-Control-Allow-Origin' 'https://i13c204.p.ssafy.io' always;
                add_header              'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
                add_header              'Access-Control-Allow-Credentials' 'true' always;

                if ($request_method = 'OPTIONS') {
                        add_header      'Access-Control-Allow-Origin' 'https://i13c204.p.ssafy.io';
                        add_header      'Access-Control-Allow-Methods' 'GET, POST, DELETE, PATCH, OPTIONS';
                        add_header      'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                        add_header      'Access-Control-Allow-Credentials' 'true';

                        return 204;
                }

                proxy_redirect          off;
        }
}